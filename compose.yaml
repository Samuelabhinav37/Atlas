services:
  atlas-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atlas-gateway
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - ATLAS_WORKSPACE_ROOT=/workspace
      # Required for /v1/agent/evaluate and step-up approval to work -- generate your
      # own with `python -c "import secrets; print(secrets.token_hex(32))"` and set it
      # in the environment (e.g. via `docker compose --env-file`), don't commit a real one.
      - ATLAS_JWT_SECRET=${ATLAS_JWT_SECRET:?ATLAS_JWT_SECRET must be set}
    volumes:
      - ./policies:/policies:ro
      - ./taxonomy:/taxonomy:ro
      - ./atlas_audit.jsonl:/app/atlas_audit.jsonl
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

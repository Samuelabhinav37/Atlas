[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas-control-plane"
version = "0.1.0"
description = "Runtime AI Agent Security Control Plane and Policy Enforcement Gateway mapping to MITRE ATLAS & OWASP Agentic Top 10"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.10,<3",
  "sqlglot>=26.0,<27",
  "bashlex>=0.18,<1",
  "pyjwt[crypto]>=2.13,<3",
  "cryptography>=44.0,<45",
  "pyyaml>=6.0,<7",
  "rich>=13.9,<14",
  "typer>=0.15,<1",
]

[project.scripts]
atlas = "atlas.cli:app"

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.12,<1",
  "respx>=0.22,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["apps/gateway/src/atlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/gateway/src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]
